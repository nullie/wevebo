[package]
name = "wevebo"
version = "0.1.0"
edition = "2024"
default-run = "wevebo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
irc = "1.1.0"
tokio = { version = "1.46.1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
futures = "0.3.31"
failure = "0.1.8"
reqwest = { version = "0.12.22", features = ["json"] }
serde = "1.0.219"
chrono = { version = "0.4.41", features = ["serde"] }
env_logger = "0.11.8"
log = "0.4.27"
